# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '32 10 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v5
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue has had no activity for 60 days. It will be closed in 7 days unless there is a new comment.'
        stale-pr-message: 'This pull request has had no activity for 60 days. It will be closed in 7 days unless there is a new commit or comment.'
        stale-issue-label: 'no-issue-activity'
        stale-pr-label: 'no-pr-activity'
