name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      entry: ${{ steps.artifact.outputs.entry }}
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — package.json's `packageManager` field pins pnpm,
      # and setting both makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm build:static
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # A green `vite build` is not the same as a deployable artifact. This
      # opens the output and checks the things that actually break a Pages
      # deployment: the SPA fallback, .nojekyll, every asset URL carrying the
      # base path and existing on disk, no unresolved %VITE_% placeholder, and
      # a bundle that talks to localStorage rather than to /api/trpc.
      - name: Verify the static artifact
        id: artifact
        run: |
          node scripts/verifyStaticBuild.mjs dist/public "/${{ github.event.repository.name }}/"
          entry="$(node -e '
            const html = require("node:fs").readFileSync("dist/public/index.html", "utf8");
            const match = /<script[^>]*type="module"[^>]*src="([^"]+)"/.exec(html);
            if (!match) { process.exit(1); }
            process.stdout.write(match[1]);
          ')"
          echo "This build's entry bundle: $entry"
          echo "entry=$entry" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A successful deployment is not the same as a working site. If the
  # repository's Pages source is "Deploy from a branch", GitHub also runs its
  # own Jekyll build on every push and publishes it seconds after this
  # workflow's artifact — replacing the application with a themed render of
  # README.md while every job here still reports success. The only way to know
  # is to ask the live URL what it is serving.
  #
  # Both checks below run on every attempt and neither short-circuits the
  # other. The first version of this job exited on the configuration check,
  # which skipped the live fetch and left the incident report able to say the
  # setting was wrong but not what a visitor was actually getting.
  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the Pages configuration
        id: pages_config
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- repos/$GITHUB_REPOSITORY/pages ---"
          gh api "repos/$GITHUB_REPOSITORY/pages" \
            --jq '{build_type, status, html_url, url, cname, public, source}' || echo "(could not read the Pages configuration)"
          echo "--- latest legacy (branch-source) Pages build, if any ---"
          # Only a branch-source site has these. One here means GitHub is
          # building the repository itself, and its commit says from what.
          gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" \
            --jq '{status, commit, created_at, updated_at, duration}' || echo "(none — consistent with a workflow-source site)"
          echo "--- verdict ---"
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || echo unreadable)"
          echo "Pages build_type: $build_type"
          if [ "$build_type" = "unreadable" ]; then
            echo "::warning::Could not read the Pages configuration; the live check below is the arbiter."
          elif [ "$build_type" != "workflow" ]; then
            echo "::error::Pages build_type is '$build_type', not 'workflow'. GitHub is building and deploying this repository itself, over the top of this workflow. Set Settings -> Pages -> Build and deployment -> Source to 'GitHub Actions'."
            exit 1
          fi

      - name: Verify the live site is the application
        id: live
        continue-on-error: true
        run: node scripts/verifyPagesDeployment.mjs "${{ needs.deploy.outputs.page_url }}" "${{ needs.build.outputs.entry }}"

      - name: Fail if either check failed
        if: steps.pages_config.outcome == 'failure' || steps.live.outcome == 'failure'
        run: |
          echo "Pages configuration check: ${{ steps.pages_config.outcome }}"
          echo "Live site check:           ${{ steps.live.outcome }}"
          exit 1
